name: WABA BusinessOS R10 Canonical CustomerVault and Fraud Evidence
on:
  push:
    branches:
      - feature/waba-businessos-r10-canonical-fraud-evidence-20261028
  pull_request:
    paths:
      - 'src/businessosCanonicalFraud.js'
      - 'src/businessosCanonicalEvidenceGate.js'
      - 'tests/businessos-r10-canonical-fraud.test.js'
      - '.github/workflows/waba-businessos-r10-evidence.yml'
permissions:
  contents: read
jobs:
  r10-canonical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r10
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r10_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_r10 -d waba_r10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r10:offline_test_only@127.0.0.1:5432/waba_r10_test
      WABA_TOKEN: ''
      OPENPAY_PRIVATE_KEY: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R10 canonical and Fraud tests; full WABA PostgreSQL regression
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosCanonicalFraud.js
          node --check src/businessosCanonicalEvidenceGate.js
          node --test tests/*.test.js
