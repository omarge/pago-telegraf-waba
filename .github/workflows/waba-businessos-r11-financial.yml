name: WABA BusinessOS R11 Fenced Financial Handoff Offline
on:
  push:
    branches:
      - feature/waba-businessos-r11-payment-fenced-authorization-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r11-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r11
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r11_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_r11 -d waba_r11_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r11:offline_test_only@127.0.0.1:5432/waba_r11_test
      WABA_TOKEN: ''
      OPENPAY_PRIVATE_KEY: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R11 PostgreSQL real adversarial tests and full WABA regression
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosR11FencedAuthorization.js
          node --test tests/*.test.js
