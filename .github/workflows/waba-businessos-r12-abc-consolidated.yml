name: WABA R12 ABC Consolidated Offline Certification
on:
  push:
    branches:
      - feature/waba-r12-abc-consolidated-20261028
  pull_request:
    paths:
      - 'src/businessosR12*.js'
      - 'tests/businessos-r12-*.test.js'
      - 'db/waba-r12-*.sql'
      - '.github/workflows/waba-businessos-r12-abc-consolidated.yml'
permissions:
  contents: read
jobs:
  abc-full-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_abc
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_abc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_abc -d waba_abc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_abc:offline_test_only@127.0.0.1:5432/waba_abc_test
      WABA_TOKEN: ''
      OPENPAY_PRIVATE_KEY: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full PG18 WABA/R12 ABC joint regression and contract byte parity
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          test "$(git hash-object contracts/businessos/integration/v1/payment.proto)" = "e450bba8a9a11b3a14bc741797fb23d6b163e066"
          test "$(git hash-object contracts/businessos/integration/v1/common.proto)" = "ceaf14cd4a1b8ea9d6e86982f2c0420289abc823"
          node --test tests/*.test.js
  abc-static-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No-effect R12 source syntax and adversarial wire-contract checks
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosR12CanonicalWireGate.js
          node --check src/businessosR12RebalanceFencedConsumer.js
          node --check src/businessosR12KafkaHoldJournal.js
          node --test tests/businessos-r12-canonical-wire.test.js tests/businessos-r12-canonical-noncapture-identity.test.js
