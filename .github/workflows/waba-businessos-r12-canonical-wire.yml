name: WABA R12 Canonical Payment Kafka Protobuf Preflight
on:
  push:
    branches:
      - feature/waba-businessos-r12-canonical-kafka-wire-preflight-20261028
  pull_request:
    paths:
      - 'contracts/businessos/integration/v1/**'
      - 'src/businessosR12CanonicalWireGate.js'
      - 'src/businessosR12CanonicalCaptureInbox.js'
      - 'db/waba-r12-canonical-channel.sql'
      - 'tests/businessos-r12-canonical-*.test.js'
      - '.github/workflows/waba-businessos-r12-canonical-wire.yml'
permissions:
  contents: read
jobs:
  r12-canonical-postgresql18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_canonical
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_canonical_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_canonical -d waba_canonical_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_canonical:offline_test_only@127.0.0.1:5432/waba_canonical_test
      WABA_TOKEN: ''
      OPENPAY_PRIVATE_KEY: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract hashes and complete PG18 regression
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          test "$(git hash-object contracts/businessos/integration/v1/payment.proto)" = "e450bba8a9a11b3a14bc741797fb23d6b163e066"
          test "$(git hash-object contracts/businessos/integration/v1/common.proto)" = "ceaf14cd4a1b8ea9d6e86982f2c0420289abc823"
          node --check src/businessosR12CanonicalWireGate.js
          node --check src/businessosR12CanonicalCaptureInbox.js
          node --test tests/*.test.js
