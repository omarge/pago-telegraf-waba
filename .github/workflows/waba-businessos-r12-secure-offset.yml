name: WABA R12 Secured Kafka Offset Fencing (offline)
on:
  push:
    branches:
      - feature/waba-businessos-r12-secure-kafka-offset-fence-20261028
  pull_request:
    paths:
      - 'src/businessosR12SecuredKafkaConsumer.js'
      - 'src/businessosR12KafkaCommitProcessor.js'
      - 'src/businessosR12CanonicalWireGate.js'
      - 'db/waba-r12-kafka-ingress.sql'
      - 'tests/businessos-r12-secure-kafka-offset.test.js'
      - '.github/workflows/waba-businessos-r12-secure-offset.yml'
permissions:
  contents: read
jobs:
  kafka-offset-postgres18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kafka_offset
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: kafka_offset_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kafka_offset -d kafka_offset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://kafka_offset:offline_test_only@127.0.0.1:5432/kafka_offset_test
      WABA_TOKEN: ''
      OPENPAY_PRIVATE_KEY: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: All WABA tests, secured Kafka mock and real PostgreSQL18
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          test "$(git hash-object contracts/businessos/integration/v1/payment.proto)" = "e450bba8a9a11b3a14bc741797fb23d6b163e066"
          test "$(git hash-object contracts/businessos/integration/v1/common.proto)" = "ceaf14cd4a1b8ea9d6e86982f2c0420289abc823"
          node --check src/businessosR12SecuredKafkaConsumer.js
          node --check src/businessosR12KafkaCommitProcessor.js
          node --test tests/*.test.js
