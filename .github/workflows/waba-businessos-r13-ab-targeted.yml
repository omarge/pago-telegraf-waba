name: R13 A+B Targeted Offline Authority Checks
on:
  pull_request:
    paths:
      - 'src/businessosR13KafkaDeploymentPreflight.js'
      - 'src/businessosR13ReconciliationAuthorityContract.js'
      - 'src/businessosR13OfflineReadinessGate.js'
      - 'tests/businessos-r13-*.test.js'
      - '.github/workflows/waba-businessos-r13-ab-targeted.yml'
permissions:
  contents: read
jobs:
  r13-only-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Only R13 offline contract tests (no DB, Docker or Kafka)
        run: |
          node --check src/businessosR13KafkaDeploymentPreflight.js
          node --check src/businessosR13ReconciliationAuthorityContract.js
          node --check src/businessosR13OfflineReadinessGate.js
          node --test tests/businessos-r13-kafka-deployment-preflight.test.js tests/businessos-r13-reconciliation-authority-contract.test.js tests/businessos-r13-offline-readiness.test.js
