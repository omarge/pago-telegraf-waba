name: WABA BusinessOS R5 PostgreSQL Payer Claim and Signed Inbox
on:
  push:
    branches:
      - feature/waba-businessos-r5-pg-claim-signed-inbox-20261028
  pull_request:
    paths:
      - 'src/businessosPgPayerClaims.js'
      - 'src/businessosPgSignedInbox.js'
      - 'src/index.js'
      - 'db/waba-r5-channel.sql'
      - 'tests/businessos-r5-postgres.test.js'
      - '.github/workflows/waba-businessos-r5-pg.yml'
permissions:
  contents: read
jobs:
  postgres-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r5
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waba_r5 -d waba_r5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r5:offline_test_only@127.0.0.1:5432/waba_r5_test
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
      OPENPAY_PRIVATE_KEY: ''
      WABA_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline R5 and full WABA regression on PostgreSQL 18
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosPgPayerClaims.js
          node --check src/businessosPgSignedInbox.js
          node --check src/index.js
          node --test tests/*.test.js
