name: WABA BusinessOS R6 PostgreSQL Recovery and Inbox Normalizer
on:
  push:
    branches:
      - feature/waba-businessos-r6-durable-inbox-normalizer-20261028
  pull_request:
    paths:
      - 'src/businessosPgInboxNormalizer.js'
      - 'src/businessosPgSignedInbox.js'
      - 'db/waba-r6-channel.sql'
      - 'tests/businessos-r6-normalizer.test.js'
      - '.github/workflows/waba-businessos-r6-inbox.yml'
permissions:
  contents: read
jobs:
  r6-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r6
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r6_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_r6 -d waba_r6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r6:offline_test_only@127.0.0.1:5432/waba_r6_test
      OPENPAY_PRIVATE_KEY: ''
      WABA_TOKEN: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline Postgres 18, R6 recovery, complete regressions
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosPgInboxNormalizer.js
          node --check src/businessosPgSignedInbox.js
          node --test tests/*.test.js
