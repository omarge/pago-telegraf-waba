name: WABA BusinessOS R7 Fenced Routing and Delegated Authority
on:
  push:
    branches:
      - feature/waba-businessos-r7-fenced-routing-gate-20261028
  pull_request:
    paths:
      - 'src/businessosPgRoutingGate.js'
      - 'src/businessosSecurityDelegationGate.js'
      - 'db/waba-r7-channel.sql'
      - 'tests/businessos-r7-routing.test.js'
      - '.github/workflows/waba-businessos-r7-routing.yml'
permissions:
  contents: read
jobs:
  r7-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r7
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r7_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_r7 -d waba_r7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r7:offline_test_only@127.0.0.1:5432/waba_r7_test
      OPENPAY_PRIVATE_KEY: ''
      WABA_TOKEN: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Certify R7 Postgres 18 and full WABA regression
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosPgRoutingGate.js
          node --check src/businessosSecurityDelegationGate.js
          node --test tests/*.test.js
