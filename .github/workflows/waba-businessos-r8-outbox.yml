name: WABA BusinessOS R8 At-Most-Once Safe Menu Outbox
on:
  push:
    branches:
      - feature/waba-businessos-r8-safe-menu-outbox-20261028
  pull_request:
    paths:
      - 'src/businessosPgSafeMenuOutbox.js'
      - 'db/waba-r8-channel.sql'
      - 'tests/businessos-r8-outbox.test.js'
      - 'tests/pgMigrations.js'
      - '.github/workflows/waba-businessos-r8-outbox.yml'
permissions:
  contents: read
jobs:
  r8-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: waba_r8
          POSTGRES_PASSWORD: offline_test_only
          POSTGRES_DB: waba_r8_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waba_r8 -d waba_r8_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R4_POSTGRES_TEST_URL: postgresql://waba_r8:offline_test_only@127.0.0.1:5432/waba_r8_test
      OPENPAY_PRIVATE_KEY: ''
      WABA_TOKEN: ''
      WABA_SAVED_CARD_PAY_SANDBOX: '0'
      WABA_CARD_ENROLL_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R8 safe-menu dispatch simulator and full Postgres regression
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/businessosPgSafeMenuOutbox.js
          node --test tests/*.test.js
