name: WABA F06 Bilateral Routing Preflight (offline)
on:
  push:
    branches:
      - audit/waba-f06-routing-readiness-20261028
  pull_request:
    paths:
      - 'scripts/f06-routing-preflight.js'
      - 'tests/f06-routing-preflight.test.js'
      - '.github/workflows/waba-f06-routing-preflight.yml'
permissions:
  contents: read
jobs:
  f06-routing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify safe bilateral notification preflight (offline only)
        env:
          WABA_SAVED_CARD_PAY_SANDBOX: '0'
        run: node --test tests/*.test.js
