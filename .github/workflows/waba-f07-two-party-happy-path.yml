name: WABA F07 Two-Party Happy Path HTTP (offline)
on:
  push:
    branches:
      - audit/waba-f07-two-party-happy-path-e2e-20261028
  pull_request:
    paths:
      - 'src/savedCardFlow.js'
      - 'tests/f07-two-party-happy-path.test.js'
      - '.github/workflows/waba-f07-two-party-happy-path.yml'
permissions:
  contents: read
jobs:
  f07-full-happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: F07 full HTTP and simulated provider regression
        env:
          WABA_SAVED_CARD_PAY_SANDBOX: '0'
          WABA_CARD_ENROLL_SANDBOX: '0'
        run: node --test tests/*.test.js
