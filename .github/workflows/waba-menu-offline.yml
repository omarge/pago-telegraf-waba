name: WABA menu offline
on:
  push:
    branches: [main, feature/waba-menu-microapps-f01, feature/waba-account-session-f02, feature/waba-cards-pin-f03, feature/waba-saved-card-happy-path-f04, feature/waba-statement-settings-f05]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check src/index.js
          node --check src/formServer.js
          node --check src/webhook.js
          node --check src/navigation.js
          node --check src/microapps.js
          node --check src/accountService.js
          node --check src/accountRoutes.js
          node --check src/cardVault.js
          node --check src/cardRoutes.js
          node --check src/openpayCardProvider.js
          node --check src/enrollClient.js
          node --check src/savedCardFlow.js
          node --check src/savedCardRoutes.js
          node --check src/savedPayClient.js
          node --check src/statementJournal.js
          node --check src/statementRoutes.js
      - name: Install Express for HTTP integration tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Offline regression
        run: node --test tests/*.test.js
